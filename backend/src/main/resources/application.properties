server.port=8080

# ===== MySQL 数据源 =====
# 全部改为环境变量占位（冒号后为本地开发默认值）。生产环境请务必设置：
#   DB_URL / DB_USERNAME / DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://172.24.161.195/training_eval?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:song}
spring.datasource.password=${DB_PASSWORD:123456}

# ===== JWT =====
# 生产环境请务必设置 JWT_SECRET（HS256 要求 >= 32 字节）
app.jwt.secret=${JWT_SECRET:training-eval-rbac-secret-key-please-change-me-2026}
app.jwt.expire-seconds=${JWT_EXPIRE_SECONDS:28800}
