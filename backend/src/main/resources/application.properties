server.port=8080

# 激活本地 profile：敏感账号/JWT 放在 application-local.properties（已 gitignore，不提交）
spring.profiles.active=local

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://172.24.161.195/training_eval?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==== Redis ====
# 本机 6379 上跑的是 Redis 3.0（无 Stream），故默认连 6380 的 Redis 5；
# 换成标准 Redis 7 后把默认改回 6379，或用 REDIS_PORT 环境变量覆盖
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3s
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ==== JWT ====
app.jwt.secret=${JWT_SECRET}
app.jwt.expire-seconds=${JWT_EXPIRE_SECONDS:28800}

# 管理员注册邀请码：由系统生成并存于 sys_config，管理员在用户管理页查看/重置，无需环境变量

# ==== 邮件（SMTP）验证码 ====
# spring.mail.* 四项留空 → mock 模式，验证码输出到后端日志（[EMAIL-MOCK]）
# 填齐 → 用 JavaMailSender 真实发送；发送失败直接抛错，不会静默降级到 mock
# QQ/163 邮箱用授权码（非登录密码），端口 465 走 SSL
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# 发件人地址（通常和 username 一致）
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# ==== 文件上传 ====
# 成果提交限制 20MB，留出 multipart 头部余量
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ==== 人机验证（发送邮箱验证码前必须通过）====
# 图形验证码存 Redis key=captcha:{id}，一次性、默认 120 秒有效
app.captcha.ttl-seconds=${CAPTCHA_TTL_SECONDS:120}

# ==== 消息队列（Redis Stream）====
# enabled=true：提交后投递消息、后台异步评分（submit 立即返回 aiStatus=QUEUED）
# enabled=false：退回同步算分，行为与改造前一致（答辩可现场切换两条链路）
app.mq.enabled=${MQ_ENABLED:true}
app.mq.stream-key=${MQ_STREAM_KEY:mq:ai:score}
app.mq.group=${MQ_GROUP:cg:ai}
app.mq.consumer=${MQ_CONSUMER:worker-1}
app.mq.max-attempts=${MQ_MAX_ATTEMPTS:3}
app.mq.claim-idle-ms=${MQ_CLAIM_IDLE_MS:60000}
app.mq.poll-interval-ms=${MQ_POLL_INTERVAL_MS:2000}
app.mq.reclaim-interval-ms=${MQ_RECLAIM_INTERVAL_MS:30000}
