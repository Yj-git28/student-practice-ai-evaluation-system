# ======================================================================
# Nginx 反向代理配置 —— 开发模式 (dev)
# ----------------------------------------------------------------------
# 前端: Vite dev server  监听 5173
# 后端: Spring Boot      监听 8080
# Nginx: 监听 80 (http)
#
# 访问 http://localhost  → Vite 前端 (带 HMR 热更新)
# 访问 http://localhost/api/* → Spring Boot 后端
# 访问 http://localhost/uploads/* → 上传文件静态资源
#
# 使用：把本文件改名为 conf/nginx.conf，替换默认配置
# ======================================================================

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ===== 后端 Spring Boot 上游 (API) =====
    upstream backend_api {
        server 127.0.0.1:8080;
    }

    # ===== 前端 Vite Dev Server 上游 (支持 WebSocket/HMR) =====
    upstream frontend_dev {
        server 127.0.0.1:5173;
    }

    server {
        listen       80;
        server_name  localhost;

        # ---------- 1. API 请求 ----------
        # 所有 /api/* 路径反向代理到 Spring Boot (8080)
        location /api/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;

            # 转发真实请求头
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # 文件上传增大缓冲区
            client_max_body_size 30m;
        }

        # ---------- 2. 上传文件静态资源 ----------
        # /uploads/* 路径直接读后端 uploads 目录 (如果后端 upload.dir 配了)
        # 这里注释掉，开发时直接走 Spring Boot 的静态资源映射也行
        # location /uploads/ {
        #     alias E:/SE/student-practice-ai-evaluation-system/backend/uploads/;
        # }

        # ---------- 3. 前端 Vite Dev Server ----------
        # 其他所有请求走 Vite (支持 SPA history 模式 + WebSocket)
        location / {
            proxy_pass         http://frontend_dev;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket (Vite HMR 热更新需要)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }

        # ---------- 4. 健康检查 / 状态 ----------
        location = /nginx-health {
            return 200 "nginx-ok";
            add_header Content-Type text/plain;
        }
    }
}
