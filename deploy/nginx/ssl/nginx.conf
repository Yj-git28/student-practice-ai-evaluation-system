worker_processes  2;
pid        "D:\Group10SE\student-practice-ai-evaluation-system/deploy/nginx/ssl/nginx.pid";
error_log  "D:\Group10SE\student-practice-ai-evaluation-system/deploy/nginx/ssl/error.log" warn;

events {
    worker_connections  1024;
}

http {
    include       "D:\Group10SE\student-practice-ai-evaluation-system/deploy/nginx/conf/mime.types";
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 隐藏版本号，避免暴露 Nginx 具体版本
    server_tokens off;

    # Cloudflare Tunnel 从本机 127.0.0.1 连入，真实客户端 IP 在 CF-Connecting-IP 头里
    set_real_ip_from 127.0.0.1;
    real_ip_header   CF-Connecting-IP;

    # 登录/验证码接口按 IP 限流：每分钟 10 次，突发 5 次
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_status 429;

    upstream backend_api {
        server 127.0.0.1:8080;
    }
    upstream frontend_dev {
        server 127.0.0.1:5173;
    }

    server {
        listen       81;
        server_name  localhost;
        return 301 https://$host:443$request_uri;
    }

    server {
        listen       443 ssl;
        server_name  localhost;

        ssl_certificate      "D:\Group10SE\student-practice-ai-evaluation-system/deploy/nginx/ssl/cert/cert.pem";
        ssl_certificate_key  "D:\Group10SE\student-practice-ai-evaluation-system/deploy/nginx/ssl/cert/key.pem";

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=2592000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        # 登录 / 验证码 / 找回密码：按 IP 限流，防暴力破解
        location = /api/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 1m;
        }

        location ~ ^/api/auth/(login/email|email/send|register.*|forgot/reset)$ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 1m;
        }

        location /api/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 30m;
        }

        # WebSocket 实训群聊：/ws/chat 升级转发到后端 8080
        location /ws/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 生产模式：直接服务前端构建产物（不再依赖 Vite 开发服务器）
        root  "D:\Group10SE\student-practice-ai-evaluation-system/frontend/dist";
        index index.html;

        gzip on;
        gzip_min_length 1k;
        gzip_comp_level 5;
        gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带哈希的构建产物可长期缓存
        location /assets/ {
            expires 30d;
        }

        location = /nginx-health {
            default_type text/plain;
            return 200 "nginx-ssl-ok";
        }
    }
} 
