# ======================================================================
# Nginx 反向代理 + HTTPS（SSL 卸载）—— 实训教学 AI 评价系统
# ----------------------------------------------------------------------
# 架构：浏览器 --HTTPS(443)--> Nginx --HTTP(8080)--> Spring Boot
#   Nginx 负责 TLS 加解密；后端不配置 SSL，继续跑普通 HTTP。
#
# 路由分发：
#   /api/**      -> 后端 Spring Boot 127.0.0.1:8080
#   /ws/**       -> 后端 WebSocket 群聊（127.0.0.1:8080，需升级握手）
#   /uploads/**  -> 后端上传文件接口（127.0.0.1:8080）
#   其他         -> 前端打包产物 dist（SPA history 模式回退 index.html）
#
# 开发模式：不用 Nginx，直接跑前端 Vite（5173），由 Vite 代理 /api、/ws 到后端。
# 生产模式：先 `npm run build` 把前端打到 frontend/dist，再由本 Nginx 托管静态文件并反代后端。
#
# 证书：本地开发推荐用 mkcert 生成带 SAN 的证书（conf/ssl/localhost+2.pem +
#   localhost+2-key.pem），根 CA 自动加入本机信任库，浏览器显示小锁；证书不入库。
#   公网上线换可信 CA 证书（.pem + .key）。
#
# 用法（Windows）：把本文件内容覆盖到 nginx 目录下 conf\nginx.conf，
#   nginx -t          # 校验语法
#   start nginx       # 启动
#   nginx -s reload   # 改配置后热加载
# ======================================================================

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 30m;          # 与后端 multipart 上限对齐

    # WebSocket 升级：把 $http_upgrade 透传给 Connection 头
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ===== 后端 Spring Boot 上游（仍为普通 HTTP） =====
    upstream backend_api {
        server 127.0.0.1:8080;
    }

    # ===== 80 端口：HTTP 强制 301 跳转到 HTTPS =====
    server {
        listen       80;
        server_name  localhost;
        return 301 https://$host$request_uri;
    }

    # ===== 443 端口：HTTPS SSL 卸载入口 =====
    server {
        listen       443 ssl;
        server_name  localhost;

        # 证书与私钥路径（按本机实际路径填写；Windows 用正斜杠 /）
        # mkcert 生成示例（相对 conf 目录）：ssl/localhost+2.pem
        # Windows 绝对路径示例：D:/Group10SE/nginx/conf/ssl/localhost+2.pem
        # Linux 示例：          /etc/nginx/ssl/localhost+2.pem
        ssl_certificate     ssl/localhost+2.pem;
        ssl_certificate_key ssl/localhost+2-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # 前端打包产物目录（生产模式：npm run build 后产物在 frontend/dist）
        # Windows 示例：root  D:/Group10SE/student-practice-ai-evaluation-system/frontend/dist;
        # Linux 示例：  root  /var/www/student-practice/dist;
        root  html;
        index index.html;

        # ---------- 1. 后端 API ----------
        location /api/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---------- 2. WebSocket 实训群聊（需升级握手） ----------
        location /ws/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  3600s;        # 长连接，避免群聊掉线
            proxy_send_timeout  3600s;
        }

        # ---------- 3. 学生上传的成果文件 ----------
        location /uploads/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---------- 4. 前端 SPA 路由回退 ----------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 健康检查
        location = /nginx-health {
            return 200 "nginx-ok";
            add_header Content-Type text/plain;
        }
    }
}
