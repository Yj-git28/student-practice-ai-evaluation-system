# ======================================================================
# Nginx 反向代理配置 —— 生产模式 (prod)
# ----------------------------------------------------------------------
# 前端: 前端打包 dist/ 目录 (静态文件)
# 后端: Spring Boot      监听 8080
# Nginx: 监听 80 (http)
#
# 使用：
#   1. 前端先打包：cd frontend && npm run build
#   2. 打包产物复制到 dist/ 目录（或改 root 指向）
#   3. 后端启动：mvn spring-boot:run (或 java -jar backend.jar)
#   4. Nginx:把本文件改名为 conf/nginx.conf，启动 nginx
# ======================================================================

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain application/javascript application/x-javascript text/css
               application/xml application/json image/svg+xml;

    # ===== 后端 Spring Boot 上游 =====
    upstream backend_api {
        server 127.0.0.1:8080;
        # 可加更多后端做负载均衡：
        # server 127.0.0.1:8081 weight=2;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;

        # ---------- 1. 前端静态文件 (SPA) ----------
        # 前端打包后的 dist 目录路径（按你实际位置调整）
        root   E:/SE/student-practice-ai-evaluation-system/frontend/dist;
        index  index.html;

        # SPA history 模式：找不到文件就回退 index.html
        location / {
            try_files $uri $uri/ /index.html;

            # 前端静态资源强缓存（Vite 带 hash 的文件）
            location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # ---------- 2. API 请求 ----------
        location /api/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # 负载均衡 keepalive
            proxy_set_header   Connection        "";

            # 文件上传
            client_max_body_size 30m;
            proxy_request_buffering off;
        }

        # ---------- 3. 后端上传文件静态资源 ----------
        # 如果 Spring Boot 的 upload.dir = ./uploads，这里直接让 Nginx 读
        location /uploads/ {
            alias E:/SE/student-practice-ai-evaluation-system/backend/uploads/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ---------- 4. 健康检查 ----------
        location = /nginx-health {
            return 200 "nginx-ok";
            add_header Content-Type text/plain;
        }

        # ---------- 5. 错误页 ----------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
